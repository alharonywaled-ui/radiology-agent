name: Build Word 2013 x86 COM Installer
on:
  push:
    branches: [main]
    paths:
      - 'word2013/**'
      - '.github/workflows/build-word2013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile x86 .NET Framework add-in
        shell: pwsh
        run: |
          msbuild word2013/RadiologyAgent.WordAddin.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "COM add-in build failed" }
          msbuild word2013/RadiologyAgent.KeySetup.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Key setup build failed" }
          New-Item -ItemType Directory word2013/bin -Force | Out-Null
          Copy-Item word2013/bin/Release/RadiologyAgent.WordAddin.dll word2013/bin/
          Copy-Item word2013/bin/Release/RadiologyAgent.KeySetup.exe word2013/bin/
          $dll = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path word2013/bin/RadiologyAgent.WordAddin.dll))
          Write-Host "Compiled assembly: $($dll.FullName)"
          Write-Host 'MSBuild PlatformTarget=x86 was explicitly set for both projects.'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Missing Inno Setup" }
      - name: Compile setup EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" word2013/installer_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path word2013/output/RadiologyAgent_Word2013_x86_Setup.exe)) { throw "Missing setup EXE" }
          Get-FileHash word2013/output/RadiologyAgent_Word2013_x86_Setup.exe -Algorithm SHA256
      - name: Smoke-test per-user installer and COM activation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'RadiologyAgent'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'pending.key') -Value 'CI_TEST_KEY_NOT_REAL_123456' -Encoding utf8 -NoNewline
          & word2013/bin/RadiologyAgent.KeySetup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Key DPAPI setup failed' }
          if (!(Test-Path (Join-Path $root 'key.dpapi'))) { throw 'Encrypted key missing' }
          $installer=(Resolve-Path 'word2013/output/RadiologyAgent_Word2013_x86_Setup.exe').Path
          $p=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $reg='HKCU:\Software\Microsoft\Office\Word\Addins\RadiologyAgent.WordAddin'
          if (!(Test-Path $reg)) { throw 'Word COM add-in registry entry missing' }
          if ((Get-ItemProperty $reg).LoadBehavior -ne 3) { throw 'COM add-in not configured for autoload' }
          $script = '$ErrorActionPreference="Stop"; $key="Registry::HKEY_CURRENT_USER\Software\Classes\CLSID\{D1FBEFD5-3B43-4516-9B7B-CDEB47AB0FA1}\InprocServer32"; $v=Get-ItemProperty -LiteralPath $key; Write-Host "REGISTERED_CODEBASE=$($v.CodeBase)"; Write-Host "DLL_EXISTS=$(Test-Path ([uri]$v.CodeBase).LocalPath)"; Write-Host "COM_VERSION=$($v.Assembly)"; $o=New-Object -ComObject RadiologyAgent.WordAddin; if($null -eq $o){throw "COM returned null"}; Write-Output "COM_ACTIVATION_OK"'
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command $script
          if ($LASTEXITCODE -ne 0) {
            Write-Host "DIAGNOSTIC: Comparing with RegAsm generated registry"
            $regasm="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe"
            & $regasm "word2013/bin/RadiologyAgent.WordAddin.dll" /regfile:"word2013/expected-com.reg" /nologo
            if(Test-Path word2013/expected-com.reg){ Get-Content word2013/expected-com.reg | Select-Object -First 100 }
            throw '32-bit COM activation failed'
          }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RadiologyAgent_Word2013_x86_Setup
          path: word2013/output/RadiologyAgent_Word2013_x86_Setup.exe
          if-no-files-found: error
