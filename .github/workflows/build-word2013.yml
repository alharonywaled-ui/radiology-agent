name: Build Word 2013 x86 Native COM Installer
on:
  push:
    branches: [main]
    paths:
      - 'word2013/**'
      - '.github/workflows/build-word2013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile x86 Haronex Web review host
        shell: pwsh
        run: |
          msbuild word2013/RadiologyAgent.ReviewHost.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "ReviewHost compile failed" }
          New-Item -ItemType Directory word2013/bin -Force | Out-Null
          Copy-Item word2013/bin/Release/RadiologyAgent.ReviewHost.exe word2013/bin/
      - name: Package Haronex web worker with Selenium
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build automatic Edge browser worker
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller selenium
          if ($LASTEXITCODE -ne 0) { throw 'Browser worker dependencies failed' }
          python -m PyInstaller --noconfirm --onefile --console --collect-all selenium --name HaronexWebWorker --distpath word2013/bin --workpath word2013/pybuild/work --specpath word2013/pybuild word2013/HaronexWebWorker.py
          if ($LASTEXITCODE -ne 0) { throw 'Browser worker packaging failed' }
          $test=& word2013/bin/HaronexWebWorker.exe --self-test
          if ($LASTEXITCODE -ne 0 -or $test -notmatch '"ok": true') { throw "Browser parser smoke test failed: $test" }
      - name: Compile native 32-bit COM Ribbon add-in and smoke-test binary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path $env:SystemDrive 'Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (!$vs) { throw 'Visual Studio Build Tools missing' }
          $root=$PWD.Path
          $cmdPath=Join-Path $env:TEMP 'radiology-native-build.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 12
          cl /nologo /LD /std:c++17 /EHsc /W3 /DUNICODE /D_UNICODE /Fe:"$root\word2013\bin\RadiologyAgent.NativeShim.dll" "$root\word2013\NativeShim.cpp" /link /DEF:"$root\word2013\NativeShim.def" ole32.lib oleaut32.lib shell32.lib user32.lib gdi32.lib advapi32.lib
          if errorlevel 1 exit /b 13
          cl /nologo /std:c++17 /EHsc /W3 /DUNICODE /D_UNICODE /Fe:"$root\word2013\bin\NativeSmoke.exe" "$root\word2013\NativeSmoke.cpp" ole32.lib oleaut32.lib
          if errorlevel 1 exit /b 14
          "@ | Set-Content -LiteralPath $cmdPath -Encoding ASCII
          & cmd.exe /c $cmdPath
          if ($LASTEXITCODE -ne 0) { throw "Native x86 compilation failed: $LASTEXITCODE" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler=Join-Path $env:SystemDrive 'Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Missing Inno Setup" }
      - name: Build one-file installer EXE
        shell: pwsh
        run: |
          $compiler=Join-Path $env:SystemDrive 'Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $compiler word2013/installer_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed" }
          if (!(Test-Path word2013/output/Haronex_Word2013_Comprehensive_Setup.exe)) { throw "Setup missing" }
      - name: Smoke test Web Mode installer and native COM Ribbon
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path word2013/output/Haronex_Word2013_Comprehensive_Setup.exe).Path
          $p=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $reg=Get-ItemProperty 'HKCU:\Software\Microsoft\Office\Word\Addins\RadiologyAgent.Word2013.Safe'
          if ($reg.LoadBehavior -ne 3) { throw 'Autoload registration incorrect' }
          if (Test-Path 'HKCU:\Software\Microsoft\Office\Word\Addins\RadiologyAgent.WordAddin') { throw 'Legacy WordAddin registration still exists' }
          $hostExe=Join-Path $env:LOCALAPPDATA 'RadiologyAgent\Word2013Safe\RadiologyAgent.ReviewHost.exe'
          if (!(Test-Path $hostExe)) { throw "Web host not installed" }
          $worker=Join-Path $env:LOCALAPPDATA 'RadiologyAgent\Word2013Safe\HaronexWebWorker.exe'
          if (!(Test-Path $worker)) { throw "Web worker not installed" }
          $enabled=Get-ItemProperty -Path 'HKCU:\Software\Haronex' -ErrorAction SilentlyContinue
          if ($enabled -and $enabled.WebTransferAllowed -eq 1) { throw 'Silent installer must not grant consent automatically' }
          & word2013/bin/NativeSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Native x86 COM or Ribbon test failed: $LASTEXITCODE" }
          Write-Host 'WEB_MODE_SMOKE_TEST_PASSED'
      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Haronex_Word2013_Comprehensive_V5
          path: word2013/output/Haronex_Word2013_Comprehensive_Setup.exe
          if-no-files-found: error
