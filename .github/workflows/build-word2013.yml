name: Build Word 2013 x86 Native COM Installer
on:
  pull_request:
    branches: [main]
    paths:
      - 'word2013/**'
      - '.github/workflows/build-word2013.yml'
  push:
    branches: [main]
    paths:
      - 'word2013/**'
      - '.github/workflows/build-word2013.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile x86 Haronex Web review host
        shell: pwsh
        run: |
          msbuild word2013/RadiologyAgent.ReviewHost.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "ReviewHost compile failed" }
          New-Item -ItemType Directory word2013/bin -Force | Out-Null
          Copy-Item word2013/bin/Release/RadiologyAgent.ReviewHost.exe word2013/bin/
          & word2013/bin/RadiologyAgent.ReviewHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Live review monitor offline self-test failed: $LASTEXITCODE" }
      - name: Compile encrypted Groq key setup helper
        shell: pwsh
        run: |
          msbuild word2013/RadiologyAgent.KeySetup.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Key setup compile failed" }
          Copy-Item word2013/bin/Release/RadiologyAgent.KeySetup.exe word2013/bin/
          & word2013/bin/RadiologyAgent.KeySetup.exe --check
          if ($LASTEXITCODE -ne 2) { throw "Expected no key in clean CI environment" }
          $global:LASTEXITCODE=0 # Expected negative key check must not fail the CI step
      - name: Package Haronex Groq Qwen worker
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build direct Groq API worker
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller 'urllib3>=2.2,<3'
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller dependencies failed' }
          python word2013/GroqReviewWorker.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Offline retry/backoff regression tests failed' }
          python word2013/PerformanceQualityRegression.py
          if ($LASTEXITCODE -ne 0) { throw 'V11.14 performance and four-pass quality contract failed' }
          $oldCodePage=$env:PYTHONIOENCODING
          try {
            $env:PYTHONIOENCODING='cp1252:strict'
            $unicodeTest=python word2013/GroqReviewWorker.py --unicode-self-test
            if ($LASTEXITCODE -ne 0) { throw 'Unicode worker protocol test failed on ANSI code page' }
            $unicodeData=$unicodeTest | ConvertFrom-Json
            if ($unicodeData.ok -ne $true -or
                $unicodeData.groups[0][0].explanation -notmatch 'مراجعة' -or
                $unicodeData.groups[0][0].explanation -notmatch 'phleboliths') {
              throw 'Unicode JSON did not round trip under simulated Windows cp1252'
            }
          } finally { $env:PYTHONIOENCODING=$oldCodePage }
          python -m PyInstaller --noconfirm --onedir --console --contents-directory _HaronexRuntime --name HaronexGroqWorker --distpath word2013/bin --workpath word2013/pybuild/work --specpath word2013/pybuild word2013/GroqReviewWorker.py
          if ($LASTEXITCODE -ne 0) { throw 'Browser worker packaging failed' }
          $test=& word2013/bin/HaronexGroqWorker/HaronexGroqWorker.exe --self-test
          if ($LASTEXITCODE -ne 0 -or $test -notmatch '"ok": true') { throw "Groq review parser smoke test failed: $test" }
          $savedEncoding=$env:PYTHONIOENCODING
          try {
            $env:PYTHONIOENCODING='cp1252:strict'
            $wire=& word2013/bin/HaronexGroqWorker/HaronexGroqWorker.exe --unicode-self-test
            if ($LASTEXITCODE -ne 0) { throw "Frozen Groq Unicode smoke test failed" }
            $roundtrip=$wire | ConvertFrom-Json
            if ($roundtrip.groups[0][0].explanation -notmatch 'مراجعة') {
              throw 'Frozen worker lost Unicode text under cp1252'
            }
          } finally { $env:PYTHONIOENCODING=$savedEncoding }
          Write-Host 'WINDOWS_CP1252_UNICODE_ROUNDTRIP_OK'
          python word2013/PerformanceQualityRegression.py word2013/bin/HaronexGroqWorker/HaronexGroqWorker.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged resident-worker protocol regression failed" }
      - name: Compile native 32-bit COM Ribbon add-in and smoke-test binary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path $env:SystemDrive 'Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (!$vs) { throw 'Visual Studio Build Tools missing' }
          $root=$PWD.Path
          $cmdPath=Join-Path $env:TEMP 'radiology-native-build.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 12
          cl /nologo /LD /std:c++17 /EHsc /MT /W3 /DUNICODE /D_UNICODE /Fe:"$root\word2013\bin\RadiologyAgent.NativeShim.dll" "$root\word2013\NativeShim.cpp" /link /DEF:"$root\word2013\NativeShim.def" ole32.lib oleaut32.lib shell32.lib user32.lib gdi32.lib advapi32.lib
          if errorlevel 1 exit /b 13
          cl /nologo /std:c++17 /EHsc /MT /W3 /DUNICODE /D_UNICODE /Fe:"$root\word2013\bin\NativeSmoke.exe" "$root\word2013\NativeSmoke.cpp" ole32.lib oleaut32.lib advapi32.lib user32.lib
          if errorlevel 1 exit /b 14
          "@ | Set-Content -LiteralPath $cmdPath -Encoding ASCII
          & cmd.exe /c $cmdPath
          if ($LASTEXITCODE -ne 0) { throw "Native x86 compilation failed: $LASTEXITCODE" }
      - name: Bundle official Microsoft .NET Framework 4.8 offline prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe'
          $dst='word2013/bin/NDP48-x86-x64-AllOS-ENU.exe'
          Invoke-WebRequest -Uri $url -OutFile $dst -MaximumRedirection 5
          $item=Get-Item $dst
          if($item.Length -lt 80MB) { throw "Bundled .NET offline installer is unexpectedly small: $($item.Length)" }
          $signature=Get-AuthenticodeSignature $dst
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft .NET offline installer signature is invalid: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Write-Host "BUNDLED_MICROSOFT_DOTNET_48_OFFLINE_VALIDATED"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler=Join-Path $env:SystemDrive 'Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Missing Inno Setup" }
      - name: Build one-file installer EXE
        shell: pwsh
        run: |
          $compiler=Join-Path $env:SystemDrive 'Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $compiler word2013/installer_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed" }
          if (!(Test-Path word2013/output/Haronex_Word2013_Groq_Qwen38_V11_19_Setup.exe)) { throw "Setup missing" }
      - name: Smoke test Web Mode installer and native COM Ribbon
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path word2013/output/Haronex_Word2013_Groq_Qwen38_V11_19_Setup.exe).Path
          $p=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $reg=Get-ItemProperty 'HKCU:\Software\Microsoft\Office\Word\Addins\RadiologyAgent.Word2013.Safe'
          if ($reg.LoadBehavior -ne 3) { throw 'Autoload registration incorrect' }
          if (Test-Path 'HKCU:\Software\Microsoft\Office\Word\Addins\RadiologyAgent.WordAddin') { throw 'Legacy WordAddin registration still exists' }
          $hostExe=Join-Path $env:LOCALAPPDATA 'RadiologyAgent\Word2013Safe\RadiologyAgent.ReviewHost.exe'
          if (!(Test-Path $hostExe)) { throw "Web host not installed" }
          $worker=Join-Path $env:LOCALAPPDATA 'RadiologyAgent\Word2013Safe\HaronexGroqWorker.exe'
          if (!(Test-Path $worker)) { throw "Groq worker not installed" }
          $runtime=Join-Path $env:LOCALAPPDATA 'RadiologyAgent\Word2013Safe\_HaronexRuntime'
          if (!(Test-Path $runtime)) { throw "Optimized onedir Groq runtime missing" }
          $start=[Diagnostics.Stopwatch]::StartNew()
          $installedWorkerTest=& $worker --self-test
          $start.Stop()
          if ($LASTEXITCODE -ne 0 -or $installedWorkerTest -notmatch '"ok": true') {
            throw "Installed optimized Groq worker self-test failed"
          }
          Write-Host "INSTALLED_OPTIMIZED_GROQ_WORKER_SELF_TEST_OK startup_ms=$($start.ElapsedMilliseconds)"
          $unicodeOutput=& $worker --unicode-self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Unicode protocol test failed" }
          $unicodeCheck=$unicodeOutput | ConvertFrom-Json
          if ($unicodeCheck.groups[0][0].explanation -notmatch 'مراجعة') {
            throw 'Installed worker did not preserve Unicode clinical explanation'
          }
          python word2013/PerformanceQualityRegression.py $worker
          if ($LASTEXITCODE -ne 0) { throw "Installed persistent worker protocol failed" }
          $enabled=Get-ItemProperty -Path 'HKCU:\Software\Haronex' -ErrorAction SilentlyContinue
          if ($enabled -and $enabled.WebTransferAllowed -eq 1) { throw 'Silent installer must not grant consent automatically' }
          & word2013/bin/NativeSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Native x86 COM or Ribbon test failed: $LASTEXITCODE" }
          Write-Host 'GROQ_QWEN_INSTALL_SMOKE_TEST_PASSED'
      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Haronex_Word2013_Groq_Qwen38_V11_19
          path: word2013/output/Haronex_Word2013_Groq_Qwen38_V11_19_Setup.exe
          if-no-files-found: error

      - name: Publish direct-download EXE as GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $exe='word2013/output/Haronex_Word2013_Groq_Qwen38_V11_19_Setup.exe'
          if (!(Test-Path $exe)) { throw 'Tested EXE missing' }
          $tag='haronex-v11-19-full-context'
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --repo ${{ github.repository }} --clobber
          } else {
            gh release create $tag $exe --repo ${{ github.repository }} --title 'Haronex V11.19 Full Context' --notes 'Word 2013 x86 installer: context-aware review, inline suggestion popup, single-click Apply. Offline CI smoke tested; clinical and real Word end-to-end validation still required.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Direct EXE release publishing failed' }
